name: Resolve release version
description: >
  Pick the next SemVer from the latest GitHub release and the merged pull
  request's release labels, and use the pull request title as release notes.

inputs:
  token:
    description: Token that can read releases and pull requests.
    default: ${{ github.token }}

outputs:
  version:
    description: >
      Next version without a "v" prefix. "release: major" and
      "release: minor" labels bump major or minor; anything else bumps patch.
    value: ${{ steps.resolve.outputs.version }}
  notes:
    description: >
      Title of the merged pull request, or the commit subject for a direct
      push.
    value: ${{ steps.resolve.outputs.notes }}

runs:
  using: composite
  steps:
    - id: resolve
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        latest="$(gh release list --limit 1 --json tagName \
          --jq '.[0].tagName // "v0.0.0"')"
        IFS=. read -r major minor patch <<< "${latest#v}"
        commit="repos/$GH_REPO/commits/$GITHUB_SHA"
        labels="$(gh api "$commit/pulls" --jq '.[].labels[].name')"
        title="$(gh api "$commit/pulls" --jq '.[0].title // empty')"
        if [ -z "$title" ]; then
          title="$(gh api "$commit" --jq '.commit.message | split("\n")[0]')"
        fi
        case "$labels" in
          *"release: major"*) version="$((major + 1)).0.0" ;;
          *"release: minor"*) version="$major.$((minor + 1)).0" ;;
          *) version="$major.$minor.$((patch + 1))" ;;
        esac
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "notes=$title" >> "$GITHUB_OUTPUT"
